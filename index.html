<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Theme toggle -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

  <!-- Greeting / clock -->
  <header class="hero">
    <p id="date" class="date"></p>
    <h1 id="greeting" class="greeting">Hello!</h1>
    <div class="name-row">
      <label for="name-input" class="name-label">Call me</label>
      <input id="name-input" class="name-input" type="text" placeholder="your name" maxlength="30" autocomplete="off" />
    </div>
    <div id="clock" class="clock">00:00:00</div>
  </header>

  <main class="grid">
    <!-- Focus Timer -->
    <section class="card timer-card">
      <h2 class="card-title">⏱️ Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="start-btn" class="btn btn-primary" type="button">Start</button>
        <button id="stop-btn" class="btn" type="button">Stop</button>
        <button id="reset-btn" class="btn" type="button">Reset</button>
      </div>
      <div class="timer-sessions">
        <span>Completed focus sessions:</span>
        <span id="sessions-count" class="sessions-count">0</span>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input id="todo-input" type="text" placeholder="Add a new task..." maxlength="100" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-message" class="todo-message" aria-live="polite"></p>
    </section>

    <!-- Quick Links -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>
      <form id="link-form" class="link-form" autocomplete="off">
        <input id="link-name" type="text" placeholder="Name" maxlength="30" />
        <input id="link-url" type="text" placeholder="example.com" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div id="links-list" class="links-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Built with HTML, CSS &amp; JavaScript · Data saved in your browser</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
